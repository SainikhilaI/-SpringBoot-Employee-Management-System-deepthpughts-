spring.application.name=SpringBootEmployeeManagementSystem

# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
server.port=8081

# ===================================================================
# TICKET LF-201: CORS CONFIGURATION (No Hardcoded Origins)
# ===================================================================
# Externalizes allowed origins so dev, staging, and production can be configured cleanly
app.cors.allowed-origins=http://localhost:3000

# ===================================================================
# SUPABASE POSTGRESQL CONNECTION & HIKARI OPTIMIZATIONS (Fixes Ticket LF-205)
# ===================================================================

spring.datasource.url=jdbc:postgresql://db.xvwvjzfvwuxrkdkdjjds.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=P0stgr3@sql
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Hikari Connection Pool Management for Cloud Databases (Supabase/PgBouncer)
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=60000
# max-lifetime must be shorter than Supabase connection reaping time (set to 4.5 minutes)
spring.datasource.hikari.max-lifetime=270000
# Sends a lightweight heartbeat every 30 seconds to keep connection alive and warm
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=30000

# Global Safety Net Defaults for Pageable Lists (Fixes Ticket LF-203)
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ===================================================================
# REDIS CACHING CONNECTION (Upstash Cloud - Cleaned and Secured)
# ===================================================================
# Fixed: Removed "https://" protocol from host
spring.data.redis.host=adapted-hamster-117753.upstash.io
spring.data.redis.port=6379
spring.data.redis.password=gQAAAAAAAcv5AAIgcDIwNWIyYzQ3MTk2MmE0MzRkOGJiZmJkOTNkZGYxYWQ5OA

# Redis Network Failure Protection Rules (Fixes Ticket LF-202)
spring.data.redis.connect-timeout=2000ms
spring.data.redis.timeout=1000ms